name: ${COMPOSE_PROJECT_NAME:-portal-satu-data}
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in root .env}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in root .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in root .env}
      TZ: Asia/Makassar
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--transaction-isolation=READ-COMMITTED",
      ]
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [internal]

  migrate:
    # Reuse the single PHP image built by `api`; do not compile PHP extensions
    # independently for migrate, api, and queue.
    image: ${API_IMAGE_NAME:-portal-satu-data-api:local}
    pull_policy: never
    restart: "no"
    env_file: [./backend/.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_NAME: ${PORTAL_APP_NAME:-${NEXT_PUBLIC_APP_NAME:-Portal Satu Data API}}
      FRONTEND_TOKEN_COOKIE: ${FRONTEND_TOKEN_COOKIE:-portal_session_token}
      PORTAL_REGION_NAME: ${PORTAL_REGION_NAME:-${NEXT_PUBLIC_REGION_NAME:-}}
      PORTAL_REGION_SHORT_NAME: ${PORTAL_REGION_SHORT_NAME:-${NEXT_PUBLIC_REGION_SHORT_NAME:-}}
      PORTAL_ORGANIZATION_NAME: ${PORTAL_ORGANIZATION_NAME:-${NEXT_PUBLIC_ORGANIZATION_NAME:-}}
      PORTAL_BRAND_NAME: ${PORTAL_BRAND_NAME:-${NEXT_PUBLIC_APP_NAME:-}}
      SDI_EXPORT_PROFILE_ID: ${SDI_EXPORT_PROFILE_ID:-}
      GEOPORTAL_MANIFEST_PROFILE_ID: ${GEOPORTAL_MANIFEST_PROFILE_ID:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in root .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in root .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    image: ${API_IMAGE_NAME:-portal-satu-data-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PHP_EXT_BUILD_JOBS: ${PHP_EXT_BUILD_JOBS:-2}
    restart: unless-stopped
    env_file: [./backend/.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_NAME: ${PORTAL_APP_NAME:-${NEXT_PUBLIC_APP_NAME:-Portal Satu Data API}}
      FRONTEND_TOKEN_COOKIE: ${FRONTEND_TOKEN_COOKIE:-portal_session_token}
      PORTAL_REGION_NAME: ${PORTAL_REGION_NAME:-${NEXT_PUBLIC_REGION_NAME:-}}
      PORTAL_REGION_SHORT_NAME: ${PORTAL_REGION_SHORT_NAME:-${NEXT_PUBLIC_REGION_SHORT_NAME:-}}
      PORTAL_ORGANIZATION_NAME: ${PORTAL_ORGANIZATION_NAME:-${NEXT_PUBLIC_ORGANIZATION_NAME:-}}
      PORTAL_BRAND_NAME: ${PORTAL_BRAND_NAME:-${NEXT_PUBLIC_APP_NAME:-}}
      SDI_EXPORT_PROFILE_ID: ${SDI_EXPORT_PROFILE_ID:-}
      GEOPORTAL_MANIFEST_PROFILE_ID: ${GEOPORTAL_MANIFEST_PROFILE_ID:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in root .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in root .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: private
    command: ["sh", "-lc", "php artisan config:cache && exec php-fpm -F"]
    volumes:
      - app-storage:/var/www/html/storage/app
      - framework-storage:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  api-http:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./deploy/laravel-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks: [internal]

  queue:
    image: ${API_IMAGE_NAME:-portal-satu-data-api:local}
    pull_policy: never
    restart: unless-stopped
    user: www-data
    mem_limit: 1g
    cpus: 1.5
    env_file: [./backend/.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_NAME: ${PORTAL_APP_NAME:-${NEXT_PUBLIC_APP_NAME:-Portal Satu Data API}}
      FRONTEND_TOKEN_COOKIE: ${FRONTEND_TOKEN_COOKIE:-portal_session_token}
      PORTAL_REGION_NAME: ${PORTAL_REGION_NAME:-${NEXT_PUBLIC_REGION_NAME:-}}
      PORTAL_REGION_SHORT_NAME: ${PORTAL_REGION_SHORT_NAME:-${NEXT_PUBLIC_REGION_SHORT_NAME:-}}
      PORTAL_ORGANIZATION_NAME: ${PORTAL_ORGANIZATION_NAME:-${NEXT_PUBLIC_ORGANIZATION_NAME:-}}
      PORTAL_BRAND_NAME: ${PORTAL_BRAND_NAME:-${NEXT_PUBLIC_APP_NAME:-}}
      SDI_EXPORT_PROFILE_ID: ${SDI_EXPORT_PROFILE_ID:-}
      GEOPORTAL_MANIFEST_PROFILE_ID: ${GEOPORTAL_MANIFEST_PROFILE_ID:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in root .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in root .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: private
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "database",
        "--queue=conversions,default",
        "--sleep=2",
        "--tries=3",
        "--timeout=900",
        "--max-time=3600",
      ]
    volumes:
      - app-storage:/var/www/html/storage/app
      - framework-storage:/var/www/html/storage/framework
      - app-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: ${BACKEND_API_URL:-http://api-http:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in root .env}
        NEXT_PUBLIC_GEOPORTAL_URL: ${NEXT_PUBLIC_GEOPORTAL_URL:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
        NEXT_PUBLIC_SHORT_NAME: ${NEXT_PUBLIC_SHORT_NAME:-}
        NEXT_PUBLIC_REGION_NAME: ${NEXT_PUBLIC_REGION_NAME:-}
        NEXT_PUBLIC_BRAND_PROFILE: ${NEXT_PUBLIC_BRAND_PROFILE:-generic}
        NEXT_PUBLIC_REGION_SHORT_NAME: ${NEXT_PUBLIC_REGION_SHORT_NAME:-}
        NEXT_PUBLIC_ORGANIZATION_NAME: ${NEXT_PUBLIC_ORGANIZATION_NAME:-}
        NEXT_PUBLIC_PUBLIC_SUBTITLE: ${NEXT_PUBLIC_PUBLIC_SUBTITLE:-}
        NEXT_PUBLIC_PORTAL_TITLE: ${NEXT_PUBLIC_PORTAL_TITLE:-Portal Admin}
        NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION:-}
        NEXT_PUBLIC_LOGO_PATH: ${NEXT_PUBLIC_LOGO_PATH:-}
        NEXT_PUBLIC_LOGO_ALT: ${NEXT_PUBLIC_LOGO_ALT:-}
        NEXT_PUBLIC_HERO_IMAGE: ${NEXT_PUBLIC_HERO_IMAGE:-}
        NEXT_PUBLIC_ICON_PATH: ${NEXT_PUBLIC_ICON_PATH:-}
        NEXT_PUBLIC_PWA_ICON_192: ${NEXT_PUBLIC_PWA_ICON_192:-}
        NEXT_PUBLIC_PWA_ICON_512: ${NEXT_PUBLIC_PWA_ICON_512:-}
        NEXT_PUBLIC_PPID_NAME: ${NEXT_PUBLIC_PPID_NAME:-}
        NEXT_PUBLIC_PPID_URL: ${NEXT_PUBLIC_PPID_URL:-}
        NEXT_PUBLIC_PPID_CONTACT_URL: ${NEXT_PUBLIC_PPID_CONTACT_URL:-}
        NEXT_PUBLIC_PPID_ADDRESS: ${NEXT_PUBLIC_PPID_ADDRESS:-}
        NEXT_PUBLIC_PPID_EMAIL: ${NEXT_PUBLIC_PPID_EMAIL:-}
        NEXT_PUBLIC_PPID_PHONE: ${NEXT_PUBLIC_PPID_PHONE:-}
        NEXT_PUBLIC_LOCALE: ${NEXT_PUBLIC_LOCALE:-id-ID}
        NEXT_PUBLIC_TIME_ZONE: ${NEXT_PUBLIC_TIME_ZONE:-Asia/Makassar}
        NEXT_PUBLIC_DATASET_CATEGORIES: ${NEXT_PUBLIC_DATASET_CATEGORIES:-}
        FRONTEND_TOKEN_COOKIE: ${FRONTEND_TOKEN_COOKIE:-portal_session_token}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api-http:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in root .env}
      NEXT_PUBLIC_GEOPORTAL_URL: ${NEXT_PUBLIC_GEOPORTAL_URL:-}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-}
      NEXT_PUBLIC_SHORT_NAME: ${NEXT_PUBLIC_SHORT_NAME:-}
      NEXT_PUBLIC_REGION_NAME: ${NEXT_PUBLIC_REGION_NAME:-}
      NEXT_PUBLIC_BRAND_PROFILE: ${NEXT_PUBLIC_BRAND_PROFILE:-generic}
      NEXT_PUBLIC_REGION_SHORT_NAME: ${NEXT_PUBLIC_REGION_SHORT_NAME:-}
      NEXT_PUBLIC_ORGANIZATION_NAME: ${NEXT_PUBLIC_ORGANIZATION_NAME:-}
      NEXT_PUBLIC_PUBLIC_SUBTITLE: ${NEXT_PUBLIC_PUBLIC_SUBTITLE:-}
      NEXT_PUBLIC_PORTAL_TITLE: ${NEXT_PUBLIC_PORTAL_TITLE:-Portal Admin}
      NEXT_PUBLIC_SITE_DESCRIPTION: ${NEXT_PUBLIC_SITE_DESCRIPTION:-}
      NEXT_PUBLIC_LOGO_PATH: ${NEXT_PUBLIC_LOGO_PATH:-}
      NEXT_PUBLIC_LOGO_ALT: ${NEXT_PUBLIC_LOGO_ALT:-}
      NEXT_PUBLIC_HERO_IMAGE: ${NEXT_PUBLIC_HERO_IMAGE:-}
      NEXT_PUBLIC_ICON_PATH: ${NEXT_PUBLIC_ICON_PATH:-}
      NEXT_PUBLIC_PWA_ICON_192: ${NEXT_PUBLIC_PWA_ICON_192:-}
      NEXT_PUBLIC_PWA_ICON_512: ${NEXT_PUBLIC_PWA_ICON_512:-}
      NEXT_PUBLIC_PPID_NAME: ${NEXT_PUBLIC_PPID_NAME:-}
      NEXT_PUBLIC_PPID_URL: ${NEXT_PUBLIC_PPID_URL:-}
      NEXT_PUBLIC_PPID_CONTACT_URL: ${NEXT_PUBLIC_PPID_CONTACT_URL:-}
      NEXT_PUBLIC_PPID_ADDRESS: ${NEXT_PUBLIC_PPID_ADDRESS:-}
      NEXT_PUBLIC_PPID_EMAIL: ${NEXT_PUBLIC_PPID_EMAIL:-}
      NEXT_PUBLIC_PPID_PHONE: ${NEXT_PUBLIC_PPID_PHONE:-}
      NEXT_PUBLIC_LOCALE: ${NEXT_PUBLIC_LOCALE:-id-ID}
      NEXT_PUBLIC_TIME_ZONE: ${NEXT_PUBLIC_TIME_ZONE:-Asia/Makassar}
      NEXT_PUBLIC_DATASET_CATEGORIES: ${NEXT_PUBLIC_DATASET_CATEGORIES:-}
      FRONTEND_TOKEN_COOKIE: ${FRONTEND_TOKEN_COOKIE:-portal_session_token}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      api-http:
        condition: service_healthy
    networks: [internal]

  edge:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${EDGE_BIND_ADDRESS:-127.0.0.1}:${EDGE_PORT:-8080}:80"
    volumes:
      - ./deploy/edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-http:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [internal]

  # Optional Cloudflare Tunnel: start with `docker compose --profile tunnel up -d cloudflared`.
  # The tunnel routes to http://edge:80; no inbound public port is required.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [tunnel]
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "run",
        "--token",
        "${CLOUDFLARE_TUNNEL_TOKEN:-}",
      ]
    depends_on:
      - edge
    networks: [internal]

volumes:
  database-data:
  app-storage:
  framework-storage:
  app-logs:

networks:
  internal:
    driver: bridge
