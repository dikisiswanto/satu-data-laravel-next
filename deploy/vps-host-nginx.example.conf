# Example HOST Nginx vhost. Replace domain and certificate paths.
# The Docker edge itself remains bound to 127.0.0.1:8080.
server {
    listen 80;
    listen [::]:80;
    server_name data.domain-anda.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name data.domain-anda.go.id;

    ssl_certificate /etc/letsencrypt/live/data.domain-anda.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.domain-anda.go.id/privkey.pem;
    client_max_body_size 28m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite this header; the edge only trusts it from a private origin path.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        proxy_request_buffering off;
    }
}
