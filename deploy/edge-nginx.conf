# Edge is intentionally loopback-bound by Compose. Cloudflare Tunnel supplies
# CF-Connecting-IP; the host-Nginx example overwrites that header with its
# verified $remote_addr. Never expose this origin directly to the public Internet.
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Per-client limits use the real viewer address, not the cloudflared container IP.
limit_req_zone $client_real_ip zone=api_general:10m rate=20r/s;
limit_req_zone $client_real_ip zone=api_auth:10m rate=5r/s;
limit_conn_zone $client_real_ip zone=per_ip_conn:10m;
limit_conn_zone $server_name zone=all_conn:10m;

server {
    listen 80;
    server_name _;
    client_max_body_size 28m;
    client_body_timeout 180s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn per_ip_conn 20;
    limit_conn all_conn 200;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Same-origin API routing: browser upload stays on the frontend origin,
    # while all API execution goes directly to Laravel's internal HTTP gateway.
    location = /api {
        proxy_pass http://api-http:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering on;
    }
    # Binary upload is the only route allowed a longer body/read timeout and
    # disabled request buffering. Conversion itself is always asynchronous.
    location ~ ^/api/(v1/portal/datasets/[^/]+/uploads/content|portal/dataset/[^/]+/upload-content)$ {
        limit_req zone=api_general burst=10 nodelay;
        limit_req_status 429;
        client_body_timeout 180s;
        proxy_pass http://api-http:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
        proxy_buffering on;
    }
    location ~ ^/api/(auth|v1/auth)/ {
        limit_req zone=api_auth burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://api-http:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api-http:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
        proxy_buffering on;
    }
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
