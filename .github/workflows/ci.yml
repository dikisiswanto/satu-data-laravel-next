name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Periksa versi Node.js dan npm
        run: |
          node --version
          test "$(npm --version)" = "10.9.2"
      - name: Pasang dependensi terkunci
        run: npm ci
      - name: Periksa struktur, integrasi, dan namespace
        run: npm run check
      - name: Periksa kualitas kode
        run: npm run lint
      - name: Jalankan test unit
        run: npm run test
      - name: Pasang browser untuk test E2E
        run: npx playwright install --with-deps chromium
      - name: Jalankan test E2E
        run: npm run test:e2e
      - name: Build frontend produksi
        run: npm run build

  backend-tests:
    name: Backend Laravel dan MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-ci-password
          MARIADB_DATABASE: satu_data_testing
          MARIADB_USER: satu_test
          MARIADB_PASSWORD: satu-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://localhost
      API_PUBLIC_URL: http://localhost
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: satu_data_testing
      DB_USERNAME: satu_test
      DB_PASSWORD: satu-test-password
      PRIVATE_STORAGE_DRIVER: local
      PRIVATE_STORAGE_PATH: /tmp/satu-data-wajo-private
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none
      - name: Pasang dependensi Laravel
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Periksa sintaks PHP
        working-directory: backend
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Uji migration pada MariaDB kosong
        working-directory: backend
        run: php artisan migrate --force
      - name: Jalankan test Laravel
        working-directory: backend
        run: php artisan test

  docker-images:
    name: Build image produksi
    needs: [verify, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validasi konfigurasi Docker Compose
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose config --quiet
      - name: Build image Laravel
        run: docker build --pull --tag satu-data-wajo-api:ci ./backend
      - name: Build image Next.js
        run: >-
          docker build --pull
          --build-arg BACKEND_API_URL=http://api-http:8080
          --build-arg NEXT_PUBLIC_SITE_URL=https://example.test
          --build-arg NEXT_PUBLIC_GEOPORTAL_URL=https://geoportal-wajo.vercel.app
          --tag satu-data-wajo-web:ci .
