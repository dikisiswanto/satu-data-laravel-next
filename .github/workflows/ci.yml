name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Gunakan versi npm yang dipatok proyek
        run: |
          npm install --global npm@10.9.2
          test "$(npm --version)" = "10.9.2"
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-ci-password
          MARIADB_DATABASE: satu_data_testing
          MARIADB_USER: satu_test
          MARIADB_PASSWORD: satu-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_URL: http://localhost
      API_PUBLIC_URL: http://localhost
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: satu_data_testing
      DB_USERNAME: satu_test
      DB_PASSWORD: satu-test-password
      PRIVATE_STORAGE_DRIVER: local
      PRIVATE_STORAGE_PATH: /tmp/satu-data-wajo-private
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, xml, zip
          coverage: none
      - name: Pasang dependensi Laravel
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Uji migration pada MariaDB kosong
        working-directory: backend
        run: php artisan migrate --force
      - name: Jalankan test Laravel
        working-directory: backend
        run: php artisan test

  docker-images:
    needs: [verify, backend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate full-stack Compose configuration
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          docker compose config --quiet
      - name: Build Laravel production image
        run: docker build --pull --tag satu-data-wajo-api:ci ./backend
      - name: Build Next.js standalone production image
        run: >-
          docker build --pull
          --build-arg BACKEND_API_URL=http://api-http:8080
          --build-arg NEXT_PUBLIC_SITE_URL=https://example.test
          --build-arg NEXT_PUBLIC_GEOPORTAL_URL=https://geoportal-wajo.vercel.app
          --tag satu-data-wajo-web:ci .
